name: Apply bounded HDP rejection observability retention

on:
  push:
    branches:
      - scope/first-protected-analysis-adapter
    paths:
      - '.github/workflows/hdp-rejection-observability-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scope/first-protected-analysis-adapter
          fetch-depth: 0
          path: nfe-site-intelligence-builder2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nfe-site-intelligence-builder2/package-lock.json

      - name: Apply bounded PropertyScope-only patch
        working-directory: nfe-site-intelligence-builder2
        run: python3 scripts/hdp-rejection-observability-patch.py

      - name: Install dependencies
        working-directory: nfe-site-intelligence-builder2
        run: npm ci

      - name: Full verification before commit
        working-directory: nfe-site-intelligence-builder2
        run: npm run verify

      - name: Commit bounded durable patch
        working-directory: nfe-site-intelligence-builder2
        run: |
          git config user.name "darkbishop43-tech"
          git config user.email "darkbishop43@gmail.com"
          git add -A
          git commit -m "Retain safe HDP rejection observability"
          git push origin HEAD:scope/first-protected-analysis-adapter
