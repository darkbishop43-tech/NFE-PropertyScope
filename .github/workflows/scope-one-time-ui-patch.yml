name: SCOPE one-time protected adapter UI patch

on:
  push:
    branches:
      - scope/first-protected-analysis-adapter

permissions:
  contents: write

jobs:
  apply-ui-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scope/first-protected-analysis-adapter
          fetch-depth: 0

      - name: Apply exact bounded PropertyScope UI edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/sites/[projectId]/page.tsx';
          let text = fs.readFileSync(path, 'utf8');

          function replaceOne(needle, replacement, label) {
            const count = text.split(needle).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one match, found ${count}`);
            text = text.replace(needle, replacement);
          }

          replaceOne(
            "  MockNfeOsAdapter,\n  summarizeIntegrationRun",
            "  MockNfeOsAdapter,\n  RemoteNfeOsAdapter,\n  summarizeIntegrationRun",
            'remote adapter import'
          );

          replaceOne(
            "    const adapter = new MockNfeOsAdapter();",
            "    const adapter = process.env.NEXT_PUBLIC_NFE_OS_ADAPTER_MODE === 'remote'\n      ? new RemoteNfeOsAdapter()\n      : new MockNfeOsAdapter();",
            'adapter selection'
          );

          replaceOne(
            "      isMock: adapter.isMock,\n      startedAt\n    };",
            "      isMock: adapter.isMock,\n      startedAt,\n      correlationId: runId\n    };",
            'run correlation'
          );

          replaceOne(
            "      const payload = buildRealEstateNfePayload(current, evidence);",
            "      const payload = buildRealEstateNfePayload(current, evidence, runId);",
            'payload correlation'
          );

          replaceOne(
            "      const rrsReview = await adapter.runRrs({ payload, nfeAnalysis, hdpAnalysis });",
            `      if (hdpAnalysis.rejected || hdpAnalysis.validationStatus === 'rejected') {\n        const rejectedRun: NfeOsIntegrationRun = {\n          ...partialRun,\n          status: 'PARTIAL',\n          completedAt: new Date().toISOString(),\n          errorMessage: hdpAnalysis.rejectionReason || 'HDP output was rejected by the authoritative validator.'\n        };\n        persist({\n          ...current,\n          evidence,\n          findings: nfeAnalysis.findings,\n          analysisCompleted: true,\n          nfeOsRuns: [rejectedRun, ...(current.nfeOsRuns ?? [])],\n          status: 'HDP rejected — NFE preserved; RRS not run',\n          updatedAt: new Date().toISOString()\n        });\n        setMessage('HDP was rejected by the authoritative validator. The rejected output was preserved as rejected, RRS was not run, and no automatic retry was started.');\n        setTab('Site Analysis');\n        return;\n      }\n\n      const rrsReview = await adapter.runRrs({ payload, nfeAnalysis, hdpAnalysis });`,
            'HDP rejection gate'
          );

          replaceOne(
            "      const scenarios: DevelopmentScenario[] = demoProjects[0].scenarios.map((scenario) => ({\n        ...scenario,\n        id: `${scenario.id}-${current.id.slice(0, 6)}`\n      }));",
            "      const scenarios: DevelopmentScenario[] = adapter.isMock\n        ? demoProjects[0].scenarios.map((scenario) => ({\n            ...scenario,\n            id: `${scenario.id}-${current.id.slice(0, 6)}`\n          }))\n        : current.scenarios;",
            'live scenario isolation'
          );

          replaceOne(
            "      setMessage(`DEVELOPMENT / MOCK NFE, HDP, and RRS completed through ${adapter.adapterVersion}. Outputs are separated and stored with provenance.`);",
            "      setMessage(adapter.isMock\n        ? `DEVELOPMENT / MOCK NFE, HDP, and RRS completed through ${adapter.adapterVersion}. Outputs are separated and stored with provenance.`\n        : `PRIVATE LIVE RESEARCH NFE, HDP, and RRS completed through ${adapter.adapterVersion}. Outputs remain separated with same-property correlation and safe provenance.`);",
            'truthful live completion message'
          );

          replaceOne(
            "  const latestRun = project.nfeOsRuns?.[0];\n  const nfeFindings",
            "  const latestRun = project.nfeOsRuns?.[0];\n  const liveMode = process.env.NEXT_PUBLIC_NFE_OS_ADAPTER_MODE === 'remote';\n  const nfeFindings",
            'live mode display state'
          );

          replaceOne(
            "        <button className=\"button button-primary\" onClick={onRun} disabled={working}>{latestRun ? 'Run Again Manually' : 'Run DEVELOPMENT / MOCK Analysis'}</button>",
            "        <button className=\"button button-primary\" onClick={onRun} disabled={working}>{latestRun ? 'Run Again Manually' : liveMode ? 'Run NFE-OS Analysis' : 'Run DEVELOPMENT / MOCK Analysis'}</button>",
            'explicit live action label'
          );

          replaceOne(
            "        <strong>{latestRun?.isMock !== false ? 'DEVELOPMENT / MOCK' : 'NFE-OS SERVICE'}</strong>",
            "        <strong>{latestRun ? (latestRun.isMock ? 'DEVELOPMENT / MOCK' : 'PRIVATE LIVE RESEARCH') : (liveMode ? 'PRIVATE LIVE RESEARCH READY' : 'DEVELOPMENT / MOCK')}</strong>",
            'live governance label'
          );

          replaceOne(
            "      </div>\n\n      <div className=\"analysis-subtabs\">",
            `      </div>\n\n      {latestRun && (\n        <div className="source-row">\n          <span>Property case: {latestRun.realEstateCaseId} · Run correlation: {latestRun.correlationId || latestRun.id}</span>\n          <span>NFE {latestRun.nfeRequestId || '—'} · HDP {latestRun.hdpRequestId || '—'} · RRS {latestRun.rrsRequestId || '—'}</span>\n          <span>Service: {latestRun.providerMetadata?.service || latestRun.providerMetadata?.provider || (latestRun.isMock ? 'DEVELOPMENT / MOCK' : 'Protected NFE-OS service')}</span>\n        </div>\n      )}\n\n      <div className="analysis-subtabs">`,
            'visible correlation provenance'
          );

          replaceOne(
            "        nfeFindings.length === 0 ? <Empty title=\"NFE Analysis has not been run\" text=\"Use the explicit Run NFE-OS Analysis control. No model calls occur automatically on page load.\" /> : (",
            `        latestRun?.nfeAnalysis?.answer ? (\n          <article className="analysis-section">\n            <div className="analysis-section-title"><span>Protected NFE Analysis</span><small>{latestRun.nfeRequestId}</small></div>\n            <div className="finding-row"><div className="importance-dot importance-medium" /><div><p>{latestRun.nfeAnalysis.answer}</p><small>Producer: NFE Analysis · Validation {latestRun.nfeAnalysis.validationStatus || 'unknown'} · Further property verification required</small></div></div>\n          </article>\n        ) : nfeFindings.length === 0 ? <Empty title="NFE Analysis has not been run" text="Use the explicit Run NFE-OS Analysis control. No model calls occur automatically on page load." /> : (`,
            'protected NFE result rendering'
          );

          replaceOne(
            `        latestRun?.hdpAnalysis ? (\n          <SystemOutput title="HDP Discovery" requestId={latestRun.hdpRequestId} generatedAt={latestRun.hdpAnalysis.generatedAt} items={latestRun.hdpAnalysis.discoveries} />\n        ) : <Empty title="HDP Discovery not available" text="HDP remains a distinct output. Run the explicit analysis workflow to populate the current DEVELOPMENT / MOCK adapter result." />`,
            `        latestRun?.hdpAnalysis?.rejected ? (\n          <div className="analysis-error-state"><strong>HDP validator rejected this output</strong><p>{latestRun.hdpAnalysis.rejectionReason || 'The generated HDP reasoning did not satisfy the authoritative validation contract.'}</p><small>Request {latestRun.hdpRequestId} · Result remains rejected · RRS was not run from this rejected material.</small></div>\n        ) : latestRun?.hdpAnalysis ? (\n          <SystemOutput title={\`HDP Discovery${latestRun.hdpAnalysis.resultState ? \` — ${latestRun.hdpAnalysis.resultState}\` : ''}\`} requestId={latestRun.hdpRequestId} generatedAt={latestRun.hdpAnalysis.generatedAt} items={latestRun.hdpAnalysis.discoveries} />\n        ) : <Empty title="HDP Discovery not available" text="HDP remains a distinct output. Run the explicit analysis workflow to populate it." />`,
            'HDP accepted/rejected rendering'
          );

          replaceOne(
            "        <div className=\"analysis-error-state\"><strong>NFE-OS analysis unavailable</strong><p>{latestRun.errorMessage}</p><small>Property data was preserved. No automatic retry was started.</small></div>",
            "        <div className=\"analysis-error-state\"><strong>{latestRun.hdpAnalysis?.rejected ? 'HDP rejected — partial run preserved' : 'NFE-OS analysis unavailable'}</strong><p>{latestRun.errorMessage}</p><small>Property data and valid prior module results were preserved. No automatic retry was started.</small></div>",
            'failure preservation message'
          );

          fs.writeFileSync(path, text);
          NODE

          rm .github/workflows/scope-one-time-ui-patch.yml
          git diff --check
          node scripts/assert-isolated-repo.mjs
          node scripts/protected-adapter-check.mjs

      - name: Dependency-backed TypeScript and production build
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit exact page wiring and remove temporary workflow
        shell: bash
        run: |
          git config user.name "SCOPE Builder 02"
          git config user.email "scope-builder-02@users.noreply.github.com"
          git add 'app/sites/[projectId]/page.tsx' .github/workflows/scope-one-time-ui-patch.yml
          git commit -m "Complete protected analysis UI wiring"
          git push origin HEAD:scope/first-protected-analysis-adapter
